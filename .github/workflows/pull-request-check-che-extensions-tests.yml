name: Che Extensions Tests

# Trigger the workflow on pull request
on: [pull_request]

jobs:
  che-extensions-tests:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # Che extensions whose unit tests currently pass.
        # TODO: add che-api, che-port and che-resource-monitor once their failing tests are fixed:
        # - che-api: tests/github-service-impl.spec.ts (Logger is not provided to GithubServiceImpl)
        # - che-port: tests/port-scanner (Cannot redefine property: readFile),
        #   tests/endpoints-tree-data-provider
        # - che-resource-monitor: tests/extension.spec.ts, tests/resource-monitor.spec.ts
        #   (SecretStorage mock misses keys() from the current vscode API)
        extension:
          - che-github-authentication
          - che-remote
    steps:
      - name: Checkout che-code source code
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: 'code/.nvmrc'
      - name: Install ${{ matrix.extension }} dependencies
        working-directory: code/extensions/${{ matrix.extension }}
        run: npm ci
      - name: Run ${{ matrix.extension }} tests
        working-directory: code/extensions/${{ matrix.extension }}
        run: npm test
